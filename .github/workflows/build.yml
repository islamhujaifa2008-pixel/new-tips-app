name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Force Accept SDK Licenses and Install Build-Tools
      run: |
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
        cd /home/runner/.buildozer/android/platform/android-sdk
        
        # Command-line tools ডাউনলোড এবং সেটাপ
        curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/latest/ 2>/dev/null || true
        mv cmdline-tools/lib cmdline-tools/latest/ 2>/dev/null || true
        
        SDKMANAGER="/home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager"
        
        # সমস্ত লাইসেন্স অটোমেটিক এক্সেপ্ট করা এবং বিল্ড-টুলস ইন্সটল করা
        yes | $SDKMANAGER --licenses || true
        $SDKMANAGER "platform-tools" "platforms;android-33" "build-tools;37.0.0" || true

    - name: Build with Buildozer (Final)
      run: buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
