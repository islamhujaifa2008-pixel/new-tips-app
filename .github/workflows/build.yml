name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Pre-install Android SDK and sdkmanager for Buildozer
      run: |
        # বিল্ডুজার যে পাথটা খুঁজে বেড়ায়, ঠিক সেই পাথে এসডিকে ডিরেক্টরি তৈরি করা
        SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p $SDK_DIR
        
        # অফিশিয়াল কমান্ড-лайн টুলস ডাউনলোড করে বিল্ডুজারের কাঙ্ক্ষিত লোকেশনে বসানো
        cd /tmp
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O commandlinetools.zip
        unzip -q commandlinetools.zip
        
        # সঠিক স্ট্রাকচারে মুভ করা যাতে tools/bin/sdkmanager তৈরি হয়
        mkdir -p $SDK_DIR/cmdline-tools
        mv /tmp/cmdline-tools $SDK_DIR/cmdline-tools/latest
        
        mkdir -p $SDK_DIR/tools/bin
        ln -s $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager || true

        # লাইসেন্স ফাইল ফোর্সিভলি তৈরি করা
        mkdir -p $SDK_DIR/licenses
        echo -e "\n8933bac161af42a8b425bd7971f4d01326c36471" > $SDK_DIR/licenses/android-sdk-license
        echo -e "\n24333f8a43b688d23c7b056aadc915a0f031d3f0" >> $SDK_DIR/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6485e" >> $SDK_DIR/licenses/android-sdk-license

    - name: Build with Buildozer (Final)
      run: buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
