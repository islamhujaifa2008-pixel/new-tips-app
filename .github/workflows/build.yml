import glob
import os

from kivy.app import App
from kivy.core.text import LabelBase
from kivy.uix.boxlayout import BoxLayout
from kivy.uix.button import Button
from kivy.uix.label import Label

BASE_DIR = os.path.dirname(os.path.abspath(__file__))


def register_font():
    """fonts ফোল্ডারের প্রথম ফন্ট খুঁজে রেজিস্টার করে। না পেলে None ফেরত দেয়।"""
    font_files = (
        glob.glob(os.path.join(BASE_DIR, "fonts", "*.ttf"))
        + glob.glob(os.path.join(BASE_DIR, "fonts", "*.otf"))
    )
    if not font_files:
        return None
    try:
        LabelBase.register(name="CustomFont", fn_regular=font_files[0])
        return "CustomFont"
    except Exception:
        return None


class MyApp(App):
    def build(self):
        font = register_font()
        font_kwargs = {"font_name": font} if font else {}

        layout = BoxLayout(orientation="vertical", padding=20, spacing=20)

        label = Label(text="অ্যাপ চালু হয়েছে", font_size=40, **font_kwargs)
        button = Button(text="ক্লিক করুন", font_size=30, size_hint_y=0.3, **font_kwargs)

        def on_click(instance):
            label.text = "বাটনে ক্লিক হয়েছে"

        button.bind(on_press=on_click)

        layout.add_widget(label)
        layout.add_widget(button)
        return layout


if __name__ == "__main__":
    MyApp().run()
