name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Pre-create Android SDK directories and Accept Licenses
      run: |
        # বিল্ডুজার যে পাথটা খুঁজে পাচ্ছে না, সেই পাথ এবং লাইসেন্স ফোল্ডার আগে থেকেই পুরোপুরি তৈরি করে রাখা
        SDK_PATH="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p $SDK_PATH/tools/bin
        mkdir -p $SDK_PATH/licenses
        
        # অ্যান্ড্রয়েড এসডিকে লাইসেন্সগুলো আগে থেকেই লিখে দেওয়া যাতে বিল্ডুজার কোনো প্রম্পটে না আটকে যায়
        echo -e "\n8933bac161af42a8b425bd7971f4d01326c36471" > $SDK_PATH/licenses/android-sdk-license
        echo -e "\n24333f8a43b688d23c7b056aadc915a0f031d3f0" >> $SDK_PATH/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6485e" >> $SDK_PATH/licenses/android-sdk-license

    - name: Build with Buildozer (Final)
      run: buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
