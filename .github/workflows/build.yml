name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Pre-setup Android SDK and sdkmanager (Cumulative Fix)
      env:
        ANDROID_HOME: /home/runner/android-sdk
      run: |
        # এসডিকে এবং বিল্ডুজার এক্সপেক্টেড পাথ তৈরি করা
        mkdir -p $ANDROID_HOME
        cd $ANDROID_HOME
        
        # গুগল থেকে অফিশিয়াল কমান্ড-লাইন টুলস ডাউনলোড ও এক্সট্রাক্ট করা
        curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/latest/
        mv cmdline-tools/lib cmdline-tools/latest/
        
        # পাথ যুক্ত করা যাতে sdkmanager সবসময় পাওয়া যায়
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        
        # সমস্ত লাইসেন্স অটোমেটিক এক্সেপ্ট করা এবং প্রয়োজনীয় টুলস নামিয়ে নেওয়া
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        
        # বিল্ডুজার যেন এই এসডিকে ডিরেক্টরিটাই ব্যবহার করে, তাই লিংক বা ফোল্ডার সেটআপ করা
        mkdir -p ~/.buildozer/android/platform
        ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

    - name: Build with Buildozer (Final)
      run: buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
